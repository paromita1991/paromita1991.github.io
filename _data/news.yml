- text: "Serving as an Associate Editor of [Sankhya B: The Indian Journal of Statistics](https://link.springer.com/journal/13571) from 2025."
- text: "Awarded the Bronze [Telly Award](https://www.tellyawards.com/) for [Marshall Minds Ep. 5: Distance Profiles: A Model-Free Approach to Complex Data Analysis](https://vimeo.com/1049483845) in 2025."
- text: "Named the Kenneth King Stonier Assistant Professor in Business Administration from 2025."
- text: "Awarded the Dr. Douglas Basil Award for Junior Faculty in 2024."
- text: "Awarded an [NSF DMS Grant](https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2311034), Award No. 2311034 from 2023-2026."
- text: "Awarded the USC Zumberge Individual Research Award in 2022."
- text: "Invited as a Long-Term Participant at the Simons Institute for the Theory of Computing, UC Berkeley for their [Geometric Methods in Optimization and Sampling Program](https://simons.berkeley.edu/programs/geometric-methods-optimization-sampling) in Fall 2021."
- text: "Invited to present in the [Discussion Paper meeting of the Research Section Committee[(https://rss.org.uk/news-publication/publications/journals/discussion-papers-meetings/), [Royal Statistical Society, London](https://rss.org.uk/) in Fall 2021."
